<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friend Maja Time - Multi-Device Sync Music Party</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            color: #1db954;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #b3b3b3;
            margin-bottom: 25px;
        }

        .room-section {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #282828;
            color: #fff;
            outline: none;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background-color: #1db954;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #1ed760;
        }

        .player-card {
            background: #282828;
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
        }

        .track-info {
            margin-bottom: 15px;
        }

        .track-title {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .track-artist {
            font-size: 0.85rem;
            color: #b3b3b3;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        .play-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .status {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Friend Maja Time</h1>
        <p class="subtitle">Multi-Device Sync Music Party</p>

        <!-- Room Join Section -->
        <div class="room-section">
            <input type="text" id="roomId" placeholder="Enter Party Room Code">
            <button onclick="joinRoom()">Join</button>
        </div>

        <!-- Music Player Area -->
        <div class="player-card">
            <div class="track-info">
                <div class="track-title" id="trackTitle">Party Song #1</div>
                <div class="track-artist" id="trackArtist">Maja Beats</div>
            </div>

            <audio id="audioPlayer" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

            <div class="controls">
                <button onclick="prevTrack()">⏮️</button>
                <button class="play-btn" id="playBtn" onclick="togglePlay()">▶️</button>
                <button onclick="nextTrack()">⏭️</button>
            </div>
        </div>

        <div class="status" id="statusText">Not connected to any room</div>
    </div>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const statusText = document.getElementById('statusText');

        function joinRoom() {
            const roomCode = document.getElementById('roomId').value;
            if (roomCode.trim() !== "") {
                statusText.innerText = "Connected to Room: " + roomCode;
                statusText.style.color = "#1db954";
            } else {
                alert("Please enter a valid Room Code");
            }
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.innerText = "⏸️";
            } else {
                audio.pause();
                playBtn.innerText = "▶️";
            }
        }

        function prevTrack() {
            audio.currentTime = 0;
            alert("Previous track requested");
        }

        function nextTrack() {
            audio.currentTime = 0;
            alert("Next track requested");
        }
    </script>
</body>
</html>
