<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friend Maja Time - Multi-Device Audio Sync</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PeerJS for Real-time Peer-to-Peer Sync -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- QRCode JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #ec4899;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
    }

    .flex-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background-color: var(--primary);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button.secondary {
      background-color: #334155;
    }

    button.secondary:hover {
      background-color: #475569;
    }

    .badge {
      background: #334155;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin-top: 15px;
      padding: 10px;
      background: white;
      border-radius: 8px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 15px 0;
    }

    .controls button {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 1.2rem;
    }

    .volume-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .volume-box i {
      color: var(--text-sub);
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--primary);
    }

    #visualizer {
      width: 100%;
      height: 60px;
      background: #0f172a;
      border-radius: 8px;
      margin-top: 10px;
    }

    .status-online {
      color: #10b981;
    }

    .search-result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .search-result-item:last-child {
      border-bottom: none;
    }

    .iframe-container {
      position: absolute;
      top: -9999px;
      left: -9999px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Friend Maja Time 🎉</h1>
    <p>Multi-Device Synchronized Music Player</p>
  </header>

  <div class="container">

    <!-- Connection Panel -->
    <div class="card">
      <div class="card-title">
        <i class="fa-solid fa-wifi"></i> Room Connection
      </div>
      <div id="room-setup">
        <div class="flex-row" style="margin-bottom: 10px;">
          <button id="host-btn" style="flex: 1;"><i class="fa-solid fa-crown"></i> Create Host Room</button>
        </div>
        <div class="flex-row">
          <input type="text" id="join-code" placeholder="Enter Room Code">
          <button id="join-btn" class="secondary"><i class="fa-solid fa-plug"></i> Join</button>
        </div>
      </div>

      <div id="room-info" style="display: none; margin-top: 10px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <strong>Room ID:</strong> <span id="display-room-code" class="badge">---</span>
          </div>
          <div>
            <i class="fa-solid fa-users status-online"></i> <span id="connected-count">1</span> / 20 Devices
          </div>
        </div>
        <div id="qrcode"></div>
      </div>
    </div>

    <!-- YouTube Music Search -->
    <div class="card" id="search-card">
      <div class="card-title">
        <i class="fa-brands fa-youtube"></i> Search Songs (YouTube)
      </div>
      <div class="flex-row">
        <input type="text" id="song-query" placeholder="Type song name or YouTube URL...">
        <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
      </div>
      <div id="search-results" style="margin-top: 10px; max-height: 150px; overflow-y: auto;"></div>
    </div>

    <!-- Now Playing & Master Player -->
    <div class="card">
      <div class="card-title">
        <i class="fa-solid fa-music"></i> Now Playing
      </div>
      <div style="text-align: center; margin-bottom: 10px;">
        <h3 id="song-title" style="font-size: 1rem; color: var(--text-main);">No Song Selected</h3>
        <p id="song-status" style="font-size: 0.8rem; color: var(--text-sub);">Ready to play</p>
      </div>

      <canvas id="visualizer"></canvas>

      <div class="controls">
        <button id="play-btn"><i class="fa-solid fa-play"></i></button>
        <button id="pause-btn" class="secondary"><i class="fa-solid fa-pause"></i></button>
      </div>

      <div class="volume-box">
        <i class="fa-solid fa-volume-high"></i>
        <input type="range" id="volume-slider" min="0" max="100" value="80">
      </div>
    </div>

  </div>

  <!-- Hidden YouTube Player Container -->
  <div class="iframe-container">
    <div id="yt-player"></div>
  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let peer = null;
    let connections = [];
    let isHost = false;
    let ytPlayer = null;

    // Initialize Canvas Visualizer
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    function drawVisualizer() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const bars = 25;
      const width = canvas.width / bars;
      for (let i = 0; i < bars; i++) {
        const height = Math.random() * canvas.height * 0.7;
        ctx.fillStyle = '#8b5cf6';
        ctx.fillRect(i * width, canvas.height - height, width - 2, height);
      }
    }
    setInterval(drawVisualizer, 150);

    // YouTube API Ready
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player', {
        height: '0',
        width: '0',
        videoId: 'dQw4w9WgXcQ',
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (isHost) {
        if (event.data == YT.PlayerState.PLAYING) {
          broadcast({ type: 'SYNC_PLAY', time: ytPlayer.getCurrentTime() });
        } else if (event.data == YT.PlayerState.PAUSED) {
          broadcast({ type: 'SYNC_PAUSE', time: ytPlayer.getCurrentTime() });
        }
      }
    }

    // PeerJS Setup
    document.getElementById('host-btn').addEventListener('click', () => {
      const roomId = 'FMT-' + Math.floor(1000 + Math.random() * 9000);
      peer = new Peer(roomId);
      isHost = true;

      peer.on('open', (id) => {
        document.getElementById('room-setup').style.display = 'none';
        document.getElementById('room-info').style.display = 'block';
        document.getElementById('display-room-code').innerText = id;
        
        new QRCode(document.getElementById("qrcode"), {
          text: window.location.href + '?room=' + id,
          width: 128,
          height: 128
        });
      });

      peer.on('connection', (conn) => {
        if (connections.length < 20) {
          connections.push(conn);
          updateConnectedCount();
          
          conn.on('data', (data) => handleData(data));
          conn.on('close', () => {
            connections = connections.filter(c => c !== conn);
            updateConnectedCount();
          });
        }
      });
    });

    document.getElementById('join-btn').addEventListener('click', () => {
      const code = document.getElementById('join-code').value.trim();
      if (!code) return;

      peer = new Peer();
      peer.on('open', () => {
        const conn = peer.connect(code);
        connections.push(conn);

        conn.on('open', () => {
          document.getElementById('room-setup').style.display = 'none';
          document.getElementById('room-info').style.display = 'block';
          document.getElementById('display-room-code').innerText = code;
          document.getElementById('search-card').style.display = 'none'; // Hide search for listeners
        });

        conn.on('data', (data) => handleData(data));
      });
    });

    function broadcast(data) {
      connections.forEach(conn => {
        if (conn.open) conn.send(data);
      });
    }

    function handleData(data) {
      if (data.type === 'LOAD_SONG') {
        document.getElementById('song-title').innerText = data.title;
        if (ytPlayer) ytPlayer.loadVideoById(data.videoId);
      } else if (data.type === 'SYNC_PLAY') {
        if (ytPlayer) {
          ytPlayer.seekTo(data.time, true);
          ytPlayer.playVideo();
        }
      } else if (data.type === 'SYNC_PAUSE') {
        if (ytPlayer) {
          ytPlayer.seekTo(data.time, true);
          ytPlayer.pauseVideo();
        }
      }
    }

    function updateConnectedCount() {
      document.getElementById('connected-count').innerText = connections.length + 1;
    }

    // Playback Controls
    document.getElementById('play-btn').addEventListener('click', () => {
      if (ytPlayer) {
        ytPlayer.playVideo();
        if (isHost) broadcast({ type: 'SYNC_PLAY', time: ytPlayer.getCurrentTime() });
      }
    });

    document.getElementById('pause-btn').addEventListener('click', () => {
      if (ytPlayer) {
        ytPlayer.pauseVideo();
        if (isHost) broadcast({ type: 'SYNC_PAUSE', time: ytPlayer.getCurrentTime() });
      }
    });

    document.getElementById('volume-slider').addEventListener('input', (e) => {
      if (ytPlayer) ytPlayer.setVolume(e.target.value);
    });

    // YouTube Search Mock/Trigger
    document.getElementById('search-btn').addEventListener('click', () => {
      const query = document.getElementById('song-query').value;
      if (!query) return;

      // Simple video ID extractor or fallback
      let videoId = 'dQw4w9WgXcQ'; 
      if (query.includes('v=')) {
        videoId = query.split('v=')[1].split('&')[0];
      }

      document.getElementById('song-title').innerText = "Loaded: " + query;
      if (ytPlayer) ytPlayer.loadVideoById(videoId);

      if (isHost) {
        broadcast({ type: 'LOAD_SONG', videoId: videoId, title: query });
      }
    });
  </script>
</body>
</html>
